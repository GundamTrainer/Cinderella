[project]
name = "cinderella"
version = "0.1.0"
description = "Self-developed multimodal physical character AI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]
hardware = [
  "opencv-python>=4.9",
  "sounddevice>=0.4.6",
]

[tool.setuptools]
packages = ["runtime", "runtime.event_bus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
